name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, packages: musl-tools }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - if: matrix.cross
        uses: taiki-e/install-action@cross
      - name: Build
        run: |
          if [ -n "${{ matrix.cross }}" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          dir="udp-broadcast-relay-redux-${{ matrix.target }}"
          mkdir -p "$dir"
          cp target/${{ matrix.target }}/release/udp-broadcast-relay-redux "$dir/"
          cp README.md README.zh-CN.md LICENSE "$dir/"
          mkdir -p "$dir/completions" "$dir/man"
          cp completions/* "$dir/completions/" 2>/dev/null || true
          cp docs/udp-broadcast-relay-redux.1 "$dir/man/" 2>/dev/null || true
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - name: Build Debian package (x86_64 gnu only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          chmod +x packaging/deb-build.sh
          packaging/deb-build.sh \
            target/x86_64-unknown-linux-gnu/release/udp-broadcast-relay-redux \
            "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: udp-broadcast-relay-redux-amd64.deb
          path: udp-broadcast-relay-redux_*.deb
          if-no-files-found: ignore
      - uses: softprops/action-gh-release@v2
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          files: udp-broadcast-relay-redux_*.deb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            udp-broadcast-relay-redux-*.tar.gz
            udp-broadcast-relay-redux-*.tar.gz.sha256
          generate_release_notes: true

  crates-io:
    name: publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish (skipped when no token is configured)
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
