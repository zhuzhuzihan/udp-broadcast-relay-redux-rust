name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + behavior suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings
      # The recorded behavior suite includes two cases that expect an interface
      # named dummy0 which is up but has no IPv4 address (mirroring the
      # environment they were recorded in).
      - name: Prepare dummy0 for the recorded ioctl cases
        run: |
          sudo ip link add dummy0 type dummy
          sudo ip link set dummy0 up
      # Two recorded cases require CAP_NET_RAW (raw socket creation), so the
      # suite runs as root.
      - name: Test (207 recorded behavior cases + unit tests)
        run: sudo -E cargo test --release
      - name: Fix target ownership
        if: always()
        run: sudo chown -R $(id -u):$(id -g) target

  build:
    name: build ${{ matrix.target }}
    needs: lint-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, packages: musl-tools }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - if: matrix.cross
        uses: taiki-e/install-action@cross
      - name: Build
        run: |
          if [ -n "${{ matrix.cross }}" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: udp-broadcast-relay-redux-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/udp-broadcast-relay-redux
          if-no-files-found: error
